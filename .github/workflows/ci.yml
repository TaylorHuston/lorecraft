name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: lorecraft_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lorecraft_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_KEY: base64:bG9yZWNyYWZ0LWNpLXRlc3Qta2V5LW5vdC1zZWNyZXQhIQ==
      APP_URL: http://localhost:3333
      CORS_ORIGIN: http://localhost:5173
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorecraft_application
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorecraft_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lorecraft_test
      ALLOW_TEST_DATABASE_WRITES: '1'
      ALLOW_E2E_DATABASE_WRITES: '1'
      HOST: localhost
      LOG_LEVEL: warn
      NODE_ENV: test
      PORT: 3333
      SESSION_DRIVER: database
      TZ: UTC

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply test migrations
        run: npm run migrate:ci --workspace @lorecraft/backend

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build applications
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Storybook browser tests
        run: npm run test:storybook

      - name: Run account journey E2E
        run: npm run test:e2e
